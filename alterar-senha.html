<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BDR Gestão - Segurança da conta</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<meta name="theme-color" content="#a4161a">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#0b1220,#1f2937);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:18px}
.card{width:460px;max-width:100%;background:#fff;border-radius:18px;padding:32px;box-shadow:0 15px 35px rgba(0,0,0,.3);border-top:5px solid #a4161a}
.logo{text-align:center;margin-bottom:18px}.logo img{width:150px;max-width:80%}
h1{color:#a4161a;font-size:24px;text-align:center;margin-bottom:6px}.sub{text-align:center;color:#555;font-size:13px;line-height:1.45;margin-bottom:20px}
label{display:block;margin-top:14px;margin-bottom:5px;font-weight:bold}
.campo-senha{position:relative}
.campo-senha input{width:100%;padding:12px 46px 12px 12px;border:1px solid #ccc;border-radius:8px;font-size:15px}
.campo-senha input.invalido{border-color:#b91c1c;box-shadow:0 0 0 2px rgba(185,28,28,.08)}
.campo-senha input.valido{border-color:#15803d}
.toggle-senha{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;color:#4b5563;border-radius:7px;cursor:pointer;display:grid;place-items:center;font-size:18px}
.toggle-senha:hover{background:#f3f4f6}.toggle-senha:focus-visible{outline:2px solid #a4161a;outline-offset:1px}
.validacao-senha{min-height:17px;margin-top:5px;font-size:12px;font-weight:700}.validacao-senha.erro{color:#b91c1c}.validacao-senha.ok{color:#15803d}
.btn{width:100%;margin-top:20px;padding:14px;background:#a4161a;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}.btn:hover{background:#7d1013}.btn:disabled{opacity:.65;cursor:not-allowed}
.btn-sec{width:100%;margin-top:8px;padding:12px;background:#f3f4f6;color:#111827;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer}
#mensagem{text-align:center;color:red;margin-top:14px;font-weight:800;font-size:13px}.info{background:#fff7ed;border-left:4px solid #f97316;border-radius:10px;padding:10px;color:#7c2d12;font-size:12px;line-height:1.45}
.usuario-box{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin-bottom:12px;color:#374151;font-size:13px}.usuario-box b{color:#111827}.oculto{display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><img src="imagens/logo.png" alt="BDR Gestão"></div>
  <h1 id="tituloPagina">Alterar senha</h1>
  <div class="sub" id="subtituloPagina">Por segurança, no primeiro acesso você precisa criar sua própria senha.</div>
  <div class="usuario-box" id="usuarioBox">Usuário: <b id="nomeUsuario">-</b><br>Perfil: <b id="perfilUsuario">-</b></div>
  <div class="info" id="infoPagina">Digite a senha provisória recebida, depois crie uma nova senha. Depois disso, somente você saberá sua senha.</div>
  <form id="formAlterarSenha">
    <div id="grupoSenhaAtual">
      <label id="labelSenhaAtual">Senha atual</label>
      <div class="campo-senha">
        <input type="password" id="senhaAtual" placeholder="Digite a senha provisória" autocomplete="current-password">
        <button class="toggle-senha" type="button" data-alvo="senhaAtual" aria-label="Mostrar senha atual" title="Mostrar senha">&#128065;</button>
      </div>
    </div>
    <label>Nova senha</label>
    <div class="campo-senha">
      <input type="password" id="novaSenha" placeholder="Digite a nova senha" required autocomplete="new-password">
      <button class="toggle-senha" type="button" data-alvo="novaSenha" aria-label="Mostrar nova senha" title="Mostrar senha">&#128065;</button>
    </div>
    <div id="regraNovaSenha" class="validacao-senha" aria-live="polite"></div>
    <label>Confirmar nova senha</label>
    <div class="campo-senha">
      <input type="password" id="confirmarSenha" placeholder="Confirme a nova senha" required autocomplete="new-password">
      <button class="toggle-senha" type="button" data-alvo="confirmarSenha" aria-label="Mostrar confirmação da senha" title="Mostrar senha">&#128065;</button>
    </div>
    <div id="validacaoConfirmacao" class="validacao-senha" aria-live="polite"></div>
    <button class="btn" id="btnSalvar" type="submit">Salvar nova senha</button>
    <button class="btn-sec" type="button" onclick="sair()">Sair</button>
    <div id="mensagem"></div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="JS/supabaseClient.js"></script>
<script>
const ATLAS_AUTH_API = "https://arquivos.sathtech.com.br";
let modoAcessoSeguro = false;
let modoMigracaoInterna = false;
let sessaoAcessoSeguro = null;

function bancoBDR(){ return window.client || window.supabaseClient || window.clientSupabase || null; }
function usuarioLocalBDR(){ try{return JSON.parse(localStorage.getItem("usuario_logado") || localStorage.getItem("usuarioLogado") || "null");}catch(_e){return null;} }
function msg(txt, cor="red"){ const el=document.getElementById("mensagem"); if(el){el.style.color=cor;el.innerText=txt||"";} }
function destinoPadraoBDR(usuario){ const perms=String(usuario?.permissoes||"").toUpperCase(); if(perms.includes("DASHBOARD_VER"))return "atlas.html#m=dashboard";if(perms.includes("PATRIMONIO_VER"))return "atlas.html#m=patrimonio";if(perms.includes("ESTOQUE_VER"))return "atlas.html#m=estoque";if(perms.includes("EXPEDICAO_VER"))return "atlas.html#m=expedicao";if(perms.includes("RELATORIOS_VER"))return "atlas.html#m=relatorios";return "atlas.html#m=dashboard"; }
async function sair(){ try{await bancoBDR()?.auth?.signOut();}catch(_e){} localStorage.removeItem("usuario_logado");localStorage.removeItem("usuarioLogado");localStorage.removeItem("perfil_usuario");location.href="login.html"; }

async function obterSessaoDoConvite(banco){
  const url = new URL(window.location.href);
  const codigo = url.searchParams.get("code");
  if(codigo){
    const {data,error}=await banco.auth.exchangeCodeForSession(codigo);
    if(!error && data?.session) return data.session;
  }
  const {data}=await banco.auth.getSession();
  return data?.session || null;
}

async function prepararPagina(){
  const banco=bancoBDR();
  if(!banco){msg("Supabase não carregou.");return;}

  try{ sessaoAcessoSeguro=await obterSessaoDoConvite(banco); }catch(_e){ sessaoAcessoSeguro=null; }

  if(sessaoAcessoSeguro?.user){
    modoAcessoSeguro=true;
    document.getElementById("tituloPagina").innerText="Ativar acesso seguro";
    document.getElementById("subtituloPagina").innerText="Crie sua senha pessoal para concluir a ativação do acesso seguro ao BDR Gestão.";
    document.getElementById("usuarioBox").innerHTML=`E-mail: <b>${sessaoAcessoSeguro.user.email || "-"}</b>`;
    document.getElementById("infoPagina").innerText="Este link confirma sua identidade pelo Supabase Auth. Defina uma nova senha; a ativação do BDR Gestão só será concluída depois que a senha for salva com sucesso.";
    document.getElementById("grupoSenhaAtual").classList.add("oculto");
    document.getElementById("senhaAtual").required=false;
    return;
  }

  const usuario=usuarioLocalBDR();
  if(!usuario){ msg("Sessão expirada. Entre novamente no BDR Gestão."); return; }
  document.getElementById("nomeUsuario").innerText=usuario.nome||usuario.usuario||"-";
  document.getElementById("perfilUsuario").innerText=usuario.perfil||"-";

  if(String(usuario.auth_status||"").toUpperCase()==="AGUARDANDO_ATIVACAO" && usuario.auth_user_id){
    modoMigracaoInterna=true;
    document.getElementById("tituloPagina").innerText="Atualização de segurança — BDR Gestão";
    document.getElementById("subtituloPagina").innerText="Crie sua nova senha para concluir a atualização de segurança da sua conta.";
    document.getElementById("infoPagina").innerText="Confirme sua senha atual e escolha uma nova senha. Seu acesso atual continua funcionando até esta etapa ser concluída.";
    document.getElementById('labelSenhaAtual').innerText='Senha atual';
    document.getElementById("senhaAtual").placeholder="Digite sua senha atual do BDR Gestão";
    document.getElementById("btnSalvar").innerText="Ativar acesso seguro";
  }
}

function configurarCamposSenha(){
  document.querySelectorAll('.toggle-senha').forEach(botao=>{
    botao.addEventListener('click',()=>{
      const input=document.getElementById(botao.dataset.alvo);
      if(!input) return;
      const mostrar=input.type==='password';
      input.type=mostrar?'text':'password';
      botao.innerHTML=mostrar?'&#128584;':'&#128065;';
      botao.setAttribute('aria-label',mostrar?'Ocultar senha':'Mostrar senha');
      botao.title=mostrar?'Ocultar senha':'Mostrar senha';
      input.focus();
    });
  });

  const nova=document.getElementById('novaSenha');
  const confirmar=document.getElementById('confirmarSenha');
  const regra=document.getElementById('regraNovaSenha');
  const validacao=document.getElementById('validacaoConfirmacao');

  function validarVisualmente(){
    const minimo=modoMigracaoInterna?8:6;
    const valorNova=nova.value;
    const valorConfirmacao=confirmar.value;

    regra.className='validacao-senha';
    regra.textContent='';
    nova.classList.remove('valido','invalido');
    if(valorNova){
      if(valorNova.length<minimo){
        regra.classList.add('erro');
        regra.textContent=`Use pelo menos ${minimo} caracteres.`;
        nova.classList.add('invalido');
      }else{
        regra.classList.add('ok');
        regra.textContent='Tamanho da senha válido.';
        nova.classList.add('valido');
      }
    }

    validacao.className='validacao-senha';
    validacao.textContent='';
    confirmar.classList.remove('valido','invalido');
    if(valorConfirmacao){
      if(valorNova!==valorConfirmacao){
        validacao.classList.add('erro');
        validacao.textContent='As senhas não coincidem.';
        confirmar.classList.add('invalido');
      }else if(valorNova.length>=minimo){
        validacao.classList.add('ok');
        validacao.textContent='As senhas coincidem.';
        confirmar.classList.add('valido');
      }
    }
  }

  nova.addEventListener('input',validarVisualmente);
  confirmar.addEventListener('input',validarVisualmente);
  confirmar.addEventListener('blur',validarVisualmente);
  window.validarSenhasVisualmente=validarVisualmente;
}

async function salvarAcessoSeguro(){
  const banco=bancoBDR();
  const novaSenha=document.getElementById("novaSenha").value;
  const confirmarSenha=document.getElementById("confirmarSenha").value;
  if(novaSenha.length<6){msg("A nova senha precisa ter no mínimo 6 caracteres.");return;}
  if(novaSenha!==confirmarSenha){msg("As senhas não coincidem. Verifique e tente novamente.");return;}

  const btn=document.getElementById("btnSalvar"); btn.disabled=true;
  try{
    const {error:erroSenha}=await banco.auth.updateUser({password:novaSenha});
    if(erroSenha){msg("Não foi possível definir a nova senha: "+erroSenha.message);return;}

    const {data:sessaoData,error:erroSessao}=await banco.auth.getSession();
    const token=sessaoData?.session?.access_token;
    if(erroSessao || !token){msg("Senha definida, mas a sessão de ativação expirou. Entre novamente pelo link recebido.");return;}

    const resposta=await fetch(`${ATLAS_AUTH_API}/api/auth/concluir-ativacao`,{
      method:"POST",
      headers:{"Authorization":`Bearer ${token}`,"Content-Type":"application/json"}
    });
    const retorno=await resposta.json().catch(()=>({}));
    if(!resposta.ok){msg(retorno.error||"A senha foi definida, mas não foi possível concluir a ativação no Atlas.");return;}

    msg("Acesso seguro ativado com sucesso. Você já pode entrar com sua nova senha.","green");
    setTimeout(async()=>{try{await banco.auth.signOut();}catch(_e){} location.href="login.html";},1200);
  }finally{btn.disabled=false;}
}

async function salvarMigracaoInterna(){
  const usuario=usuarioLocalBDR();
  const senhaAtual=document.getElementById("senhaAtual").value;
  const novaSenha=document.getElementById("novaSenha").value;
  const confirmarSenha=document.getElementById("confirmarSenha").value;
  if(!usuario?.id){msg("Sessão expirada. Entre novamente no BDR Gestão.");return;}
  if(!senhaAtual){msg("Informe sua senha atual.");return;}
  if(novaSenha.length<8){msg("A nova senha precisa ter no mínimo 8 caracteres.");return;}
  if(novaSenha===senhaAtual){msg("A nova senha precisa ser diferente da senha atual.");return;}
  if(novaSenha!==confirmarSenha){msg("As senhas não coincidem. Verifique e tente novamente.");return;}

  const btn=document.getElementById("btnSalvar"); btn.disabled=true;
  try{
    const resposta=await fetch(`${ATLAS_AUTH_API}/api/auth/concluir-migracao-legada`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({usuario_id:usuario.id,senha_atual:senhaAtual,nova_senha:novaSenha})
    });
    const retorno=await resposta.json().catch(()=>({}));
    if(!resposta.ok||!retorno.ok){msg(retorno.error||"Não foi possível concluir a atualização de segurança.");return;}
    const atualizado={...usuario,...retorno.user}; delete atualizado.senha;
    localStorage.setItem("usuario_logado",JSON.stringify(atualizado));
    localStorage.setItem("usuarioLogado",JSON.stringify(atualizado));
    msg("Acesso seguro ativado com sucesso no BDR Gestão.","green");
    setTimeout(()=>location.href=destinoPadraoBDR(atualizado),1000);
  }catch(_e){
    msg("Não foi possível comunicar com o serviço seguro. Tente novamente.");
  }finally{btn.disabled=false;}
}

async function salvarSenhaLegada(){
  const banco=bancoBDR(); const usuario=usuarioLocalBDR();
  const senhaAtual=document.getElementById("senhaAtual").value; const novaSenha=document.getElementById("novaSenha").value; const confirmarSenha=document.getElementById("confirmarSenha").value;
  if(!usuario?.id){msg("Sessão expirada. Faça login novamente.");return;}
  if(novaSenha.length<6){msg("A nova senha precisa ter no mínimo 6 caracteres.");return;}
  if(novaSenha===senhaAtual){msg("A nova senha precisa ser diferente da senha provisória.");return;}
  if(novaSenha!==confirmarSenha){msg("As senhas não coincidem. Verifique e tente novamente.");return;}

  const {data:cadastro,error:erroLeitura}=await banco.from("usuarios_sistema").select("id,senha").eq("id",usuario.id).maybeSingle();
  if(erroLeitura || !cadastro){msg("Não foi possível validar a senha atual.");return;}
  if(String(cadastro.senha||"")!==String(senhaAtual)){msg("Senha atual incorreta.");return;}

  const {data,error}=await banco.from("usuarios_sistema").update({senha:novaSenha,senha_temporaria:false,senha_provisoria:false,trocar_senha:false,updated_at:new Date().toISOString()}).eq("id",usuario.id).select("id,nome,usuario,email,perfil,empresa_id,obra_id,ativo,permissoes,obras_liberadas,foto_url,telefone,cargo,senha_provisoria,trocar_senha,senha_temporaria,auth_user_id,auth_status,owner_sistema").single();
  if(error){msg("Erro ao alterar senha: "+error.message);return;}
  const atualizado={...usuario,...data}; delete atualizado.senha;
  localStorage.setItem("usuario_logado",JSON.stringify(atualizado));localStorage.setItem("usuarioLogado",JSON.stringify(atualizado));
  msg("Senha alterada com sucesso. Entrando no sistema...","green");setTimeout(()=>location.href=destinoPadraoBDR(atualizado),900);
}

async function salvarNovaSenha(){ msg(""); if(modoAcessoSeguro) return salvarAcessoSeguro(); if(modoMigracaoInterna) return salvarMigracaoInterna(); return salvarSenhaLegada(); }
document.addEventListener("DOMContentLoaded",async()=>{await prepararPagina();configurarCamposSenha();});
document.getElementById("formAlterarSenha").addEventListener("submit",e=>{e.preventDefault();salvarNovaSenha();});
</script>
</body>
</html>
