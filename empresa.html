<script>
let empresas = [];
let obrasEmpresas = [];
let movimentacoesEmpresas = [];

const EMPRESA_PADRAO_BDR = {
  id: 17,
  nome: "BDR CONSTRUART",
  razao_social: "CONSTRUART LTDA",
  codigo_empresa: "10011",
  cnpj: "09.338.459/0001-74",
  endereco: "RUA COLÔMBIA, Nº 1802 - BAIRRO ALVORADA",
  cep: "78455-000",
  cidade: "LUCAS DO RIO VERDE",
  estado: "MT",
  tabela_insumo: 2
};

function normalizarTexto(txt){
  return String(txt || "")
    .trim()
    .toUpperCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function ehEmpresaBDR(nome){
  const t = normalizarTexto(nome);
  return t.includes("BDR") || t.includes("CONSTRUART");
}

function preencherDadosBDR(prefixo=""){
  const mapa = {
    nome: EMPRESA_PADRAO_BDR.nome,
    codigo_empresa: EMPRESA_PADRAO_BDR.codigo_empresa,
    cnpj: EMPRESA_PADRAO_BDR.cnpj,
    cidade: EMPRESA_PADRAO_BDR.cidade,
    estado: EMPRESA_PADRAO_BDR.estado,
    endereco: EMPRESA_PADRAO_BDR.endereco,
    cep: EMPRESA_PADRAO_BDR.cep,
    tabela_insumo: String(EMPRESA_PADRAO_BDR.tabela_insumo)
  };

  Object.entries(mapa).forEach(([id, valor]) => {
    const el = document.getElementById(prefixo + id);
    if(el) el.value = valor;
  });
}

function aplicarPadraoBDR(){
  const nome = document.getElementById("nome");
  if(!nome) return;

  if(ehEmpresaBDR(nome.value)){
    preencherDadosBDR("");
  }
}

function aplicarPadraoBDREdicao(){
  const nome = document.getElementById("edit_nome");
  if(!nome) return;

  if(ehEmpresaBDR(nome.value)){
    preencherDadosBDR("edit_");
  }
}

async function buscarEmpresaPadraoBDR(){
  const { data, error } = await db()
    .from("empresas")
    .select("*")
    .eq("id", EMPRESA_PADRAO_BDR.id)
    .maybeSingle();

  if(error) throw error;
  return data;
}

// A empresa padrão BDR não é atualizada durante o cadastro de obras.
// Isso evita gravações desnecessárias e respostas 406 do PostgREST.

async function salvarOuAtualizarObraDaEmpresa(empresaId, dados){
  const nomeObra = String(dados.setor_obra || "").trim().toUpperCase();
  const codigoObra = String(dados.codigo_sienge_obra || dados.codigo_empresa || "").trim();

  if(!empresaId){
    throw new Error("Empresa não identificada para vincular a obra.");
  }

  if(!nomeObra){
    throw new Error("Informe o nome da obra/setor.");
  }

  if(!codigoObra){
    throw new Error("Informe o código Sienge da obra.");
  }

  // Cadastro deve ser previsível: nunca sobrescrever uma obra existente.
  const { data: obrasEncontradas, error: erroBusca } = await db()
    .from("obras")
    .select("id,codigo_obra,nome,empresa_id")
    .eq("empresa_id", Number(empresaId))
    .eq("codigo_obra", codigoObra)
    .limit(2);

  if(erroBusca) throw erroBusca;

  if(Array.isArray(obrasEncontradas) && obrasEncontradas.length > 0){
    const existente = obrasEncontradas[0];
    throw new Error(
      `Já existe uma obra com o código ${codigoObra} nesta empresa: ${existente.nome || "-"}. Nada foi alterado.`
    );
  }

  const payloadObra = {
    empresa_id: Number(empresaId),
    nome: nomeObra,
    codigo_obra: codigoObra,
    codigo_sienge: codigoObra,
    tabela_insumo: Number(dados.tabela_insumo || EMPRESA_PADRAO_BDR.tabela_insumo || 2),
    ativa: true,
    ativo: true
  };

  const { data: obraNova, error } = await db()
    .from("obras")
    .insert([payloadObra])
    .select("id,codigo_obra,nome,empresa_id")
    .limit(1);

  if(error) throw error;

  const novaObra = Array.isArray(obraNova) ? obraNova[0] : null;
  if(!novaObra?.id){
    throw new Error("A obra não retornou confirmação após o cadastro. Confira o banco antes de tentar novamente.");
  }

  return novaObra;
}

function ir(pagina){
  window.location.href = pagina;
}

function db(){
  return window.client || window.supabaseClient;
}

/* =========================================================
   BDR PERMISSÕES - EMPRESAS
   Modelo novo: EMPRESAS_VER / CRIAR / EDITAR / INATIVAR / EXCLUIR
========================================================= */
function permissoesEmpresaBDR(usuario = usuarioAtual()){
  return String(usuario?.permissoes || "")
    .split(",")
    .map(p => String(p || "").trim().toUpperCase())
    .filter(Boolean);
}

function usuarioOwnerEmpresaBDR(usuario = usuarioAtual()){
  return Number(usuario?.id) === 1;
}

function usuarioTemPermissaoEmpresaBDR(permissao, usuario = usuarioAtual()){
  if(!usuario) return false;
  if(usuarioOwnerEmpresaBDR(usuario)) return true;
  return permissoesEmpresaBDR(usuario).includes(String(permissao || "").toUpperCase());
}

function exigirPermissaoEmpresaBDR(permissao, mensagem){
  if(usuarioTemPermissaoEmpresaBDR(permissao)) return true;
  alert(mensagem || "Você não tem permissão para executar esta ação.");
  return false;
}

function aplicarAcoesEmpresaPorPermissao(){
  document.querySelectorAll("[data-acao-permissao]").forEach(el => {
    const p = el.getAttribute("data-acao-permissao");
    const pode = usuarioTemPermissaoEmpresaBDR(p);
    el.style.display = pode ? "" : "none";
    el.hidden = !pode;
  });
}

function bloquearTelaEmpresaSemPermissao(){
  if(usuarioTemPermissaoEmpresaBDR("EMPRESAS_VER")) return true;
  alert("Você não tem permissão para acessar Empresas.");
  location.href = "dashboard.html";
  return false;
}

function campo(id){
  const el = document.getElementById(id);
  return el ? String(el.value || "").trim() : "";
}

function obraDaEmpresa(empresaId){
  return obrasEmpresas.find(o => String(o.empresa_id) === String(empresaId)) || null;
}

function usuarioAtual(){
  const u = localStorage.getItem("usuario_logado");
  return u ? JSON.parse(u) : null;
}

async function salvarEmpresa(){

  if(!exigirPermissaoEmpresaBDR("EMPRESAS_CRIAR", "Você não tem permissão para cadastrar empresa/obra.")) return;

  aplicarPadraoBDR();

  const empresa = {
    nome: campo("nome"),
    codigo_empresa: campo("codigo_empresa"),
    setor_obra: campo("setor_obra"),
    codigo_sienge_obra: campo("codigo_sienge_obra"),
    tabela_insumo: campo("tabela_insumo") || "2",
    cnpj: campo("cnpj"),
    cidade: campo("cidade"),
    estado: campo("estado"),
    endereco: campo("endereco"),
    cep: campo("cep"),
    observacao: campo("observacao"),
    ativa: true
  };

  if(!empresa.nome){
    alert("Informe o nome da empresa.");
    return;
  }

  if(!empresa.codigo_empresa){
    alert("Informe o código da empresa.");
    return;
  }

  if(!empresa.setor_obra){
    alert("Informe o setor / obra.");
    return;
  }

  try{
    if(ehEmpresaBDR(empresa.nome)){
      const existeBDR = await buscarEmpresaPadraoBDR();

      if(!existeBDR){
        alert("Empresa padrão BDR CONSTRUART ID 17 não encontrada. Verifique no banco.");
        return;
      }

      // Ao cadastrar uma obra da BDR, não atualizar a empresa 17.
      // A empresa já existe e seus dados não devem ser regravados a cada nova obra.
      const obraCriada = await salvarOuAtualizarObraDaEmpresa(EMPRESA_PADRAO_BDR.id, empresa);

      await registrarMovimentacaoEmpresa(
        "CADASTRO_OBRA_SETOR",
        existeBDR,
        `Obra/setor vinculado à BDR oficial ID ${EMPRESA_PADRAO_BDR.id}: ${obraCriada.nome || "-"} | Código da obra: ${obraCriada.codigo_obra || "-"} | Tabela: ${empresa.tabela_insumo || "2"}`
      );

      alert(`Obra cadastrada com sucesso: ${obraCriada.codigo_obra} - ${obraCriada.nome}`);
    }else{
      const { data: empresaCriada, error } = await db()
        .from("empresas")
        .insert([{
          nome: empresa.nome,
          codigo_empresa: empresa.codigo_empresa,
          setor_obra: empresa.setor_obra,
          cnpj: empresa.cnpj,
          cidade: empresa.cidade,
          estado: empresa.estado,
          endereco: empresa.endereco,
          cep: empresa.cep,
          observacao: empresa.observacao,
          ativa: true
        }])
        .select("id,nome,codigo_empresa,setor_obra")
        .limit(1);

      if(error) throw error;

      const novaEmpresa = Array.isArray(empresaCriada) ? empresaCriada[0] : null;
      if(!novaEmpresa?.id){
        throw new Error("A empresa não retornou confirmação após o cadastro. Confira o banco antes de tentar novamente.");
      }

      await salvarOuAtualizarObraDaEmpresa(novaEmpresa.id, empresa);

      await registrarMovimentacaoEmpresa(
        "CADASTRO_EMPRESA",
        novaEmpresa,
        `Empresa cadastrada: ${empresa.nome || "-"} | Código: ${empresa.codigo_empresa || "-"} | Setor/Obra: ${empresa.setor_obra || "-"}`
      );

      alert("Empresa e obra/setor cadastrados com sucesso!");
    }

    limparFormulario();
    await carregarEmpresas();

  }catch(e){
    console.error(e);
    alert(e.message || "Erro ao salvar empresa/obra.");
  }
}
async function carregarEmpresas(){

  const { data, error } = await db()
    .from("empresas")
    .select("*")
    .order("nome");

  if(error){
    alert(error.message);
    return;
  }

  empresas = data || [];

  const { data: obrasData, error: obrasError } = await db()
    .from("obras")
    .select("*")
    .order("nome");

  if(obrasError){
    console.warn("Não foi possível carregar obras vinculadas:", obrasError.message);
    obrasEmpresas = [];
  }else{
    obrasEmpresas = obrasData || [];
  }

  await carregarMovimentacoesEmpresas();

  carregarFiltroEstados();
  renderizarEmpresas();
  aplicarAcoesEmpresaPorPermissao();
  renderizarMovimentacoesEmpresas();
}

function carregarFiltroEstados(){
  const select = document.getElementById("filtroEstadoEmpresa");
  const atual = select.value;

  const estados = [...new Set(
    empresas.map(e => e.estado).filter(Boolean)
  )].sort();

  select.innerHTML = `<option value="">Todos os estados</option>`;

  estados.forEach(uf => {
    select.innerHTML += `<option value="${uf}">${uf}</option>`;
  });

  select.value = atual;
}

function renderizarEmpresas(){
  const lista = document.getElementById("listaEmpresas");
  const busca = campo("buscaEmpresa").toLowerCase();
  const filtroStatus = campo("filtroStatusEmpresa");
  const filtroEstado = campo("filtroEstadoEmpresa");

  lista.innerHTML = "";

  const filtradas = empresas.filter(e => {
    const statusTexto = e.ativa === false ? "INATIVA" : "ATIVA";

    const texto = `
      ${e.nome || ""}
      ${e.codigo_empresa || ""}
      ${e.setor_obra || ""}
      ${e.cnpj || ""}
      ${e.cidade || ""}
      ${e.estado || ""}
      ${e.endereco || ""}
      ${e.cep || ""}
      ${statusTexto}
      ${obraDaEmpresa(e.id)?.codigo_sienge || ""}
      ${obraDaEmpresa(e.id)?.tabela_insumo || ""}
    `.toLowerCase();

    return texto.includes(busca)
      && (!filtroStatus || statusTexto === filtroStatus)
      && (!filtroEstado || e.estado === filtroEstado);
  });

  if(filtradas.length === 0){
    lista.innerHTML = `<div class="empresa-linha">Nenhuma empresa encontrada.</div>`;
    return;
  }

  filtradas.forEach(e => {
    const statusTexto = e.ativa === false ? "INATIVA" : "ATIVA";
    const obraVinculada = obraDaEmpresa(e.id);

    lista.innerHTML += `
      <div class="empresa-linha" id="empresa-${e.id}">

        <div class="empresa-nome" title="${e.nome || "-"}">
          ${e.nome || "-"}
        </div>

        <div class="empresa-info">
          ${e.codigo_empresa || "-"}
        </div>

        <div class="empresa-info" title="${e.setor_obra || "-"}">
          ${e.setor_obra || "-"}
        </div>

        <div class="empresa-info">
          ${e.cidade || "-"} ${e.estado ? " / " + e.estado : ""}
        </div>

        <div>
          <span class="empresa-status ${statusTexto}">
            ${statusTexto}
          </span>
        </div>

        <div class="empresa-acoes">
          <button class="btn-mini" title="Ver detalhes" onclick="toggleDetalhes(${e.id})">📂 Detalhes</button>

          ${usuarioTemPermissaoEmpresaBDR("EMPRESAS_EDITAR") ? `
            <button class="btn-mini btn-editar" title="Editar empresa" onclick="editarEmpresa(${e.id})">✏️ Editar</button>
          ` : ``}

          ${usuarioTemPermissaoEmpresaBDR("EMPRESAS_INATIVAR") ? `
            <button class="btn-mini ${e.ativa === false ? "btn-status-success" : "btn-status-warning"}"
              title="${e.ativa === false ? "Reativar empresa" : "Inativar empresa"}"
              onclick="alterarStatusEmpresa(${e.id}, ${e.ativa === false ? "true" : "false"})">
              ${e.ativa === false ? "✅ Reativar" : "🚫 Inativar"}
            </button>
          ` : ``}
        </div>

        <div class="empresa-detalhes">
          <b>CNPJ:</b> ${e.cnpj || "-"}<br>
          <b>Endereço:</b> ${e.endereco || "-"}<br>
          <b>CEP:</b> ${e.cep || "-"}<br>
          <b>Código Sienge da obra:</b> ${obraVinculada?.codigo_sienge || "-"}<br>
          <b>Tabela de insumo:</b> ${obraVinculada?.tabela_insumo || "3"}<br>
          <b>Observação:</b> ${e.observacao || "-"}<br>
        </div>

      </div>
    `;
  });
}

function toggleDetalhes(id){
  const div = document.getElementById("empresa-" + id);
  if(div){
    div.classList.toggle("aberta");
  }
}

async function registrarMovimentacaoEmpresa(tipo, empresaAntes, observacao){

  const usuario = usuarioAtual();

  await db().from("movimentacoes").insert([{
    tipo: tipo,
    observacao: observacao,
    usuario: usuario?.nome || "SISTEMA",
    data_movimentacao: new Date().toISOString()
  }]);
}

async function carregarMovimentacoesEmpresas(){

  const { data, error } = await db()
    .from("movimentacoes")
    .select("*")
    .in("tipo", ["CADASTRO_EMPRESA", "EDICAO_EMPRESA", "ALTERACAO_STATUS_EMPRESA", "EXCLUSAO_EMPRESA"])
    .order("id", { ascending:false })
    .limit(10);

  if(error){
    console.warn("Não foi possível carregar movimentações de empresas:", error.message);
    movimentacoesEmpresas = [];
    return;
  }

  movimentacoesEmpresas = data || [];
}

function renderizarMovimentacoesEmpresas(){
  const lista = document.getElementById("listaMovEmpresas");

  if(!lista) return;

  if(movimentacoesEmpresas.length === 0){
    lista.innerHTML = "<div class='mov-empresa-linha'>Nenhuma movimentação de empresa encontrada.</div>";
    return;
  }

  lista.innerHTML = movimentacoesEmpresas.map(m => `
    <div class="mov-empresa-linha">
      <strong>${m.tipo || "-"}</strong><br>
      ${m.observacao || "-"}<br>
      <small>Usuário: ${m.usuario || "-"} • ${formatarData(m.data_movimentacao)}</small>
    </div>
  `).join("");
}

function formatarData(data){
  if(!data) return "-";
  const d = new Date(String(data).replace(" ", "T"));
  if(isNaN(d.getTime())) return data;
  return d.toLocaleString("pt-BR");
}

async function alterarStatusEmpresa(id, status){

  if(!exigirPermissaoEmpresaBDR("EMPRESAS_INATIVAR", "Você não tem permissão para inativar ou reativar empresas.")) return;

  const empresaAntes = empresas.find(e => String(e.id) === String(id));

  if(!empresaAntes){
    alert("Empresa não encontrada.");
    return;
  }

  const statusAtual = empresaAntes?.ativa === false ? "INATIVA" : "ATIVA";
  const statusNovo = status === true ? "ATIVA" : "INATIVA";

  const confirma = confirm(
    `Confirma ${statusNovo === "ATIVA" ? "REATIVAR" : "INATIVAR"} a empresa "${empresaAntes?.nome || "-"}"?`
  );

  if(!confirma) return;

  const respEmpresa = await db()
    .from("empresas")
    .update({
      ativa: status,
      ativo: status
    })
    .eq("id", id)
    .select();

  if(respEmpresa.error){
    alert("Erro ao alterar empresa: " + respEmpresa.error.message);
    return;
  }

  if(!respEmpresa.data || respEmpresa.data.length === 0){
    alert("Nenhuma linha foi alterada no banco.");
    return;
  }

  const respObras = await db()
    .from("obras")
    .update({
      ativa: status,
      ativo: status
    })
    .eq("empresa_id", id);

  if(respObras.error){
    alert("Erro ao alterar obras: " + respObras.error.message);
    return;
  }

  await registrarMovimentacaoEmpresa(
    "ALTERACAO_STATUS_EMPRESA",
    empresaAntes,
    `Empresa: ${empresaAntes?.nome || "-"} | Status anterior: ${statusAtual} | Status novo: ${statusNovo}`
  );

  alert("Status alterado com sucesso.");

  await carregarEmpresas();
}

function editarEmpresa(id){
  if(!exigirPermissaoEmpresaBDR("EMPRESAS_EDITAR", "Você não tem permissão para editar empresas.")) return;

  const empresa = empresas.find(e => String(e.id) === String(id));

  if(!empresa){
    alert("Empresa não encontrada.");
    return;
  }

  document.getElementById("edit_id").value = empresa.id;
  document.getElementById("edit_codigo_empresa").value = empresa.codigo_empresa || "";
  document.getElementById("edit_nome").value = empresa.nome || "";
  document.getElementById("edit_setor_obra").value = empresa.setor_obra || "";
  document.getElementById("edit_cnpj").value = empresa.cnpj || "";
  document.getElementById("edit_cidade").value = empresa.cidade || "";
  document.getElementById("edit_estado").value = empresa.estado || "";
  document.getElementById("edit_endereco").value = empresa.endereco || "";
  document.getElementById("edit_cep").value = empresa.cep || "";
  document.getElementById("edit_observacao").value = empresa.observacao || "";

  const obraVinculada = obraDaEmpresa(empresa.id);
  document.getElementById("edit_codigo_sienge_obra").value = obraVinculada?.codigo_sienge || "";
  document.getElementById("edit_tabela_insumo").value = obraVinculada?.tabela_insumo || 3;

  document.getElementById("editandoEmpresaTitulo").innerText = `${empresa.nome || "-"} | ${empresa.codigo_empresa || "-"}`;

  document.getElementById("cardEdicaoEmpresa").classList.add("ativo");

  document.getElementById("cardEdicaoEmpresa").scrollIntoView({
    behavior:"smooth",
    block:"start"
  });
}

function cancelarEdicaoEmpresa(){
  document.getElementById("cardEdicaoEmpresa").classList.remove("ativo");
  document.getElementById("edit_id").value = "";
}

function compararAlteracoesEmpresa(antes, depois){
  const campos = [
    ["codigo_empresa", "Código"],
    ["nome", "Nome"],
    ["setor_obra", "Setor/Obra"],
    ["cnpj", "CNPJ"],
    ["cidade", "Cidade"],
    ["estado", "Estado"],
    ["endereco", "Endereço"],
    ["cep", "CEP"],
    ["observacao", "Observação"]
  ];

  const alteracoes = [];

  campos.forEach(([campo, rotulo]) => {
    const valorAntes = String(antes?.[campo] || "").trim();
    const valorDepois = String(depois?.[campo] || "").trim();

    if(valorAntes !== valorDepois){
      alteracoes.push(`${rotulo}: "${valorAntes || "-"}" → "${valorDepois || "-"}"`);
    }
  });

  return alteracoes;
}

async function salvarEdicaoEmpresa(){

  if(!exigirPermissaoEmpresaBDR("EMPRESAS_EDITAR", "Você não tem permissão para salvar edição de empresas.")) return;

  const id = campo("edit_id");

  if(!id){
    alert("Nenhuma empresa selecionada para edição.");
    return;
  }

  const empresaAntes = empresas.find(e => String(e.id) === String(id));

  const empresaEditada = {
    codigo_empresa: campo("edit_codigo_empresa"),
    nome: campo("edit_nome"),
    setor_obra: campo("edit_setor_obra"),
    cnpj: campo("edit_cnpj"),
    cidade: campo("edit_cidade"),
    estado: campo("edit_estado"),
    endereco: campo("edit_endereco"),
    cep: campo("edit_cep"),
    observacao: campo("edit_observacao")
  };

  if(!empresaEditada.nome){
    alert("Informe o nome da empresa.");
    return;
  }

  if(!empresaEditada.codigo_empresa){
    alert("Informe o código da empresa.");
    return;
  }

  if(!empresaEditada.setor_obra){
    alert("Informe o setor / obra.");
    return;
  }

  const alteracoes = compararAlteracoesEmpresa(empresaAntes, empresaEditada);

  if(alteracoes.length === 0){
    alert("Nenhuma alteração foi feita.");
    return;
  }

  const confirma = confirm(
    "Confirma salvar as alterações desta empresa?\n\n" +
    alteracoes.join("\n")
  );

  if(!confirma) return;

  const { error } = await db()
    .from("empresas")
    .update(empresaEditada)
    .eq("id", id);

  if(error){
    alert(error.message);
    return;
  }

  const obraAtual = obraDaEmpresa(id);
  const payloadObra = {
    nome: empresaEditada.setor_obra,
    codigo_obra: empresaEditada.codigo_empresa,
    codigo_sienge: campo("edit_codigo_sienge_obra"),
    tabela_insumo: Number(campo("edit_tabela_insumo") || 3),
    ativa: true
  };

  if(obraAtual?.id){
    const { error: erroObra } = await db()
      .from("obras")
      .update(payloadObra)
      .eq("id", obraAtual.id);

    if(erroObra){
      alert("Empresa alterada, mas erro ao atualizar obra: " + erroObra.message);
      return;
    }
  }else{
    const { error: erroObraNova } = await db()
      .from("obras")
      .insert([{...payloadObra, empresa_id:id}]);

    if(erroObraNova){
      alert("Empresa alterada, mas erro ao criar obra vinculada: " + erroObraNova.message);
      return;
    }
  }

  await db()
    .from("obras")
    .update({
      nome: empresaEditada.setor_obra,
      codigo_obra: empresaEditada.codigo_empresa
    })
    .eq("empresa_id", id);

  await registrarMovimentacaoEmpresa(
    "EDICAO_EMPRESA",
    empresaAntes,
    `Empresa: ${empresaAntes?.nome || "-"} | Alterações: ${alteracoes.join(" | ")}`
  );

  alert("Empresa alterada com sucesso.");

  cancelarEdicaoEmpresa();
  carregarEmpresas();
}

async function excluirEmpresa(id){

  if(!exigirPermissaoEmpresaBDR("EMPRESAS_EXCLUIR", "Você não tem permissão para excluir empresas.")) return;

  const empresa = empresas.find(e => String(e.id) === String(id));

  if(!empresa){
    alert("Empresa não encontrada.");
    return;
  }

  const confirma = confirm(
    `APAGAR DEFINITIVAMENTE a empresa "${empresa.nome || "-"}"?\n\n` +
    "Use esta opção somente para cadastro fake/teste. Empresa real é melhor INATIVAR."
  );

  if(!confirma) return;

  const senha = prompt("Digite sua senha para confirmar a exclusão:");
  if(!senha){
    alert("Exclusão cancelada.");
    return;
  }

  const usuario = usuarioAtual();
  const senhaLocal = String(usuario?.senha || usuario?.senha_master || "");

  if(senhaLocal && senha !== senhaLocal){
    alert("Senha incorreta. Nada foi apagado.");
    return;
  }

  const resp = await db()
    .from("empresas")
    .delete()
    .eq("id", id)
    .select("id,nome");

  if(resp.error){
    alert(
      "Erro ao excluir: " + resp.error.message +
      "\n\nProvável vínculo com obras, localizações, patrimônios ou movimentações. Nesse caso use INATIVAR."
    );
    return;
  }

  if(!resp.data || resp.data.length === 0){
    alert(
      "O Supabase não apagou nenhuma linha.\n\n" +
      "Pode ser bloqueio de RLS/policy ou vínculo no banco. Nada foi apagado."
    );
    return;
  }

  await registrarMovimentacaoEmpresa(
    "EXCLUSAO_EMPRESA",
    empresa,
    `Empresa excluída definitivamente: ${empresa.nome || "-"} | ID: ${empresa.id}`
  );

  alert("Empresa excluída definitivamente.");
  await carregarEmpresas();
}
