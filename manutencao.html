<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manutenção | Atlas</title>
<script>
(function(){
  var origem = new URL(location.href);
  var destino = new URL('atlas.html', location.href);
  destino.searchParams.set('m','manutencao');
  origem.searchParams.forEach(function(v,k){ if(k !== 'm' && k !== 'modulo') destino.searchParams.set(k,v); });
  location.replace(destino.href);
})();
</script>
</head>
<body></body>
</html>
