<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BDR Patrimônio</title>
<script>
(function(){
  const atual = new URL(location.href);
  const destino = new URL('atlas.html', atual);
  destino.searchParams.set('m','patrimonio');
  for(const [chave,valor] of atual.searchParams.entries()){
    if(chave !== 'm' && chave !== 'modulo') destino.searchParams.set(chave,valor);
  }
  location.replace(destino.href);
})();
</script>
</head>
<body></body>
</html>
